name: Build and Deploy VaultOS

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION:       ap-southeast-2
  ECR_REPOSITORY:   vaultos-app
  ECS_CLUSTER:      vaultos
  ECS_SERVICE:      vaultos-service
  TASK_DEFINITION:  ecs-task-definition.json
  CONTAINER_NAME:   app

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the Docker image and push it to ECR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build \
            --tag $IMAGE_URI \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Expose the fully-qualified image URI to the deploy job
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Update the ECS task definition and deploy to Fargate
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Inject secrets into task definition
        run: |
          sed -i \
            -e 's|PLACEHOLDER_APP_KEY|${{ secrets.APP_KEY }}|g' \
            -e 's|PLACEHOLDER_DB_PASSWORD|${{ secrets.DB_PASSWORD }}|g' \
            ${{ env.TASK_DEFINITION }}

      - name: Render updated ECS task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ needs.build-and-push.outputs.image }}

      - name: Deploy updated task definition to ECS and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service:         ${{ env.ECS_SERVICE }}
          cluster:         ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
