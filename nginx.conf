user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Silence access logs for health checks to reduce noise
    map $request_uri $loggable {
        /health 0;
        default 1;
    }

    access_log /dev/stdout combined if=$loggable;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=()" always;

        # Vue SPA routing — try the file, then the directory, then fall through
        # to the Laravel front controller so client-side routes resolve correctly
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Serve Vite-compiled assets with long-lived cache headers.
        # Vite appends a content hash to filenames, so cache busting is safe.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Serve other static assets (images, fonts, etc.) with moderate caching
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Pass PHP requests to php-fpm running on the loopback interface
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
        }

        # Block access to hidden files (e.g. .env, .htaccess)
        location ~ /\. {
            deny all;
        }
    }
}
